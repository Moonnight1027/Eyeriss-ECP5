<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Microsoft JhengHei', 'Noto Sans TC', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1d32"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .box   { fill:#ffffff; stroke:#0b1d32; stroke-width:2; }
      .title { font-size:22px; font-weight:700; fill:#0b1d32; }
      .sub   { font-size:15px; fill:#334155; }
      .small { font-size:13px; fill:#475569; }
      .lbl   { font-size:14px; fill:#0b1d32; }
      .lblO  { font-size:14px; fill:#c2410c; font-weight:700; }
      .lblG  { font-size:13px; fill:#64748b; }
      .wire  { stroke:#0b1d32; stroke-width:2.2; fill:none; }
      .psum  { stroke:#c2410c; stroke-width:2.6; fill:none; }
      .ctrl  { stroke:#64748b; stroke-width:1.8; fill:none; stroke-dasharray:6 5; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Host PC -->
  <rect x="20" y="70" width="140" height="120" rx="10" fill="#e2e8f0" stroke="#0b1d32" stroke-width="2"/>
  <text x="90" y="118" text-anchor="middle" class="title">Host PC</text>
  <text x="90" y="144" text-anchor="middle" class="small">Python</text>
  <text x="90" y="162" text-anchor="middle" class="small">部署 / 驗證</text>

  <!-- FPGA boundary -->
  <rect x="190" y="20" width="1390" height="860" rx="16" fill="#f1f5f9" stroke="#0b1d32" stroke-width="2.5"/>
  <text x="1560" y="50" text-anchor="end" class="title">Lattice ECP5-25F FPGA (OrangeCrab)</text>

  <!-- USB CDC IP -->
  <rect x="230" y="70" width="250" height="120" rx="10" fill="#e2e8f0" stroke="#0b1d32" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="355" y="115" text-anchor="middle" class="title">USB CDC IP</text>
  <text x="355" y="140" text-anchor="middle" class="small">open-source (TinyFPGA)</text>
  <text x="355" y="160" text-anchor="middle" class="small">ZLP patched</text>
  <line x1="160" y1="130" x2="228" y2="130" class="wire" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="194" y="116" text-anchor="middle" class="small">USB</text>

  <!-- Top Controller -->
  <rect x="560" y="70" width="980" height="130" rx="10" class="box" style="fill:#dbeafe"/>
  <text x="580" y="102" class="title">Top Controller FSM</text>
  <text x="580" y="132" class="sub">• 指令解析 (0x01–0x06)　• Layer 設定 (W, G, P, shift)　• 資料餵送排程</text>
  <text x="580" y="160" class="sub">• PE ID 設定 (scan chain)　• 讀回 / 回傳 ofmap</text>
  <rect x="1300" y="118" width="220" height="62" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="1410" y="145" text-anchor="middle" class="lblO">Psum carry reg</text>
  <text x="1410" y="167" text-anchor="middle" class="small">32-bit × P (≤4)</text>
  <line x1="482" y1="130" x2="558" y2="130" class="wire" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="520" y="120" text-anchor="middle" class="small">valid/ready</text>

  <!-- GLB SRAM -->
  <rect x="230" y="300" width="250" height="440" rx="10" class="box"/>
  <text x="355" y="336" text-anchor="middle" class="title">GLB SRAM</text>
  <text x="355" y="360" text-anchor="middle" class="sub">8K × 32-bit (4 ch / word)</text>
  <rect x="255" y="380" width="200" height="110" rx="6" fill="#e0f2fe" stroke="#0b1d32"/>
  <text x="355" y="428" text-anchor="middle" class="lbl">ifmap</text>
  <text x="355" y="450" text-anchor="middle" class="small">G · W · W</text>
  <rect x="255" y="500" width="200" height="70" rx="6" fill="#e0f2fe" stroke="#0b1d32"/>
  <text x="355" y="530" text-anchor="middle" class="lbl">filter</text>
  <text x="355" y="552" text-anchor="middle" class="small">G · P · 9</text>
  <rect x="255" y="580" width="200" height="40" rx="6" fill="#e0f2fe" stroke="#0b1d32"/>
  <text x="355" y="606" text-anchor="middle" class="lbl">bias (P)</text>
  <rect x="255" y="630" width="200" height="90" rx="6" fill="#ffedd5" stroke="#c2410c"/>
  <text x="355" y="668" text-anchor="middle" class="lblO">psum / ofmap</text>
  <text x="355" y="690" text-anchor="middle" class="small">P · F · F</text>

  <!-- Controller <-> GLB -->
  <path d="M 620 202 L 620 250 L 400 250 L 400 298" class="wire" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="510" y="242" text-anchor="middle" class="small">addr / we / 讀回</text>

  <!-- GIN -->
  <rect x="560" y="300" width="110" height="440" rx="10" class="box" style="fill:#dcfce7"/>
  <text x="615" y="480" text-anchor="middle" class="title">GIN</text>
  <text x="615" y="508" text-anchor="middle" class="small">ifmap</text>
  <text x="615" y="526" text-anchor="middle" class="small">filter</text>
  <text x="615" y="544" text-anchor="middle" class="small">ipsum</text>
  <text x="615" y="572" text-anchor="middle" class="small">tag 定址</text>
  <line x1="482" y1="440" x2="558" y2="440" class="wire" marker-end="url(#arr)"/>
  <text x="520" y="430" text-anchor="middle" class="small">rdata</text>

  <!-- PE array -->
  <rect x="740" y="300" width="400" height="440" rx="10" class="box" style="fill:#fefce8"/>
  <text x="940" y="334" text-anchor="middle" class="title">2 × 2 PE Array</text>
  <!-- PE0 (X0,Y0) -->
  <rect x="760" y="352" width="170" height="170" rx="8" fill="#ffffff" stroke="#0b1d32" stroke-width="2"/>
  <text x="845" y="395" text-anchor="middle" class="title">PE0</text>
  <text x="845" y="420" text-anchor="middle" class="lbl">Filter row 0</text>
  <text x="845" y="448" text-anchor="middle" class="small">(X0, Y0)</text>
  <text x="845" y="480" text-anchor="middle" class="small">4× INT8 MAC</text>
  <text x="845" y="498" text-anchor="middle" class="small">2-stage pipeline</text>
  <!-- PE1 (X1,Y0) -->
  <rect x="950" y="352" width="170" height="170" rx="8" fill="#ffffff" stroke="#0b1d32" stroke-width="2"/>
  <text x="1035" y="395" text-anchor="middle" class="title">PE1</text>
  <text x="1035" y="420" text-anchor="middle" class="lbl">Filter row 1</text>
  <text x="1035" y="448" text-anchor="middle" class="small">(X1, Y0)</text>
  <text x="1035" y="480" text-anchor="middle" class="small">4× INT8 MAC</text>
  <text x="1035" y="498" text-anchor="middle" class="small">2-stage pipeline</text>
  <!-- PE2 (X0,Y1) -->
  <rect x="760" y="545" width="170" height="175" rx="8" fill="#ffffff" stroke="#0b1d32" stroke-width="2"/>
  <text x="845" y="590" text-anchor="middle" class="title">PE2</text>
  <text x="845" y="615" text-anchor="middle" class="lbl">Filter row 2</text>
  <text x="845" y="643" text-anchor="middle" class="small">(X0, Y1)</text>
  <text x="845" y="675" text-anchor="middle" class="small">4× INT8 MAC</text>
  <text x="845" y="693" text-anchor="middle" class="small">2-stage pipeline</text>
  <!-- PE3 unused -->
  <rect x="950" y="545" width="170" height="175" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1035" y="620" text-anchor="middle" class="title" style="fill:#94a3b8">PE3</text>
  <text x="1035" y="648" text-anchor="middle" class="small" style="fill:#94a3b8">(X1, Y1) unused</text>

  <line x1="672" y1="520" x2="738" y2="520" class="wire" marker-end="url(#arr)"/>

  <!-- GON -->
  <rect x="1200" y="300" width="110" height="440" rx="10" class="box" style="fill:#dcfce7"/>
  <text x="1255" y="496" text-anchor="middle" class="title">GON</text>
  <text x="1255" y="524" text-anchor="middle" class="small">opsum</text>
  <text x="1255" y="542" text-anchor="middle" class="small">tag 選擇</text>
  <line x1="1142" y1="520" x2="1198" y2="520" class="wire" marker-end="url(#arr)"/>

  <!-- scan chain / tag (dashed) -->
  <path d="M 700 202 L 700 272 L 615 272 L 615 298" class="ctrl" marker-end="url(#arrG)"/>
  <path d="M 1190 202 L 1190 272 L 1255 272 L 1255 298" class="ctrl" marker-end="url(#arrG)"/>
  <text x="945" y="268" text-anchor="middle" class="lblG">scan chain (XID / YID) · tag</text>
  <line x1="700" y1="272" x2="1190" y2="272" class="ctrl"/>

  <!-- psum path (orange) -->
  <!-- GON -> carry -->
  <path d="M 1312 400 L 1350 400 L 1350 182" class="psum" marker-end="url(#arrO)"/>
  <text x="1358" y="300" class="lblO">opsum</text>
  <!-- carry -> GIN ipsum (next PE) -->
  <path d="M 1300 160 L 1290 160 L 1290 230 L 660 230 L 660 298" class="psum" marker-end="url(#arrO)"/>
  <text x="980" y="222" text-anchor="middle" class="lblO">ipsum：PE0 → PE1 → PE2 接力</text>
  <!-- carry -> PPU -->
  <path d="M 1480 182 L 1480 558" class="psum" marker-end="url(#arrO)"/>

  <!-- PPU -->
  <rect x="1380" y="560" width="180" height="180" rx="10" class="box" style="fill:#fce7f3"/>
  <text x="1470" y="602" text-anchor="middle" class="title">PPU</text>
  <text x="1470" y="632" text-anchor="middle" class="small">arith. shift</text>
  <text x="1470" y="652" text-anchor="middle" class="small">saturate → UInt8</text>
  <text x="1470" y="672" text-anchor="middle" class="small">ReLU (zero-point 128)</text>
  <text x="1470" y="712" text-anchor="middle" class="small">最後一組、最後一列</text>

  <!-- PPU -> GLB ofmap write-back -->
  <path d="M 1470 742 L 1470 790 L 355 790 L 355 742" class="wire" marker-end="url(#arr)"/>
  <text x="920" y="782" text-anchor="middle" class="lbl">ofmap write-back (INT8)</text>
  <!-- carry -> GLB psum between channel groups -->
  <path d="M 1520 182 L 1520 250 L 1570 250 L 1570 820 L 470 820 L 470 742" class="psum" marker-end="url(#arrO)"/>
  <text x="1020" y="840" text-anchor="middle" class="lblO">psum 暫存於 GLB（輸入通道分組之間，下一組 PE0 讀回作為 ipsum）</text>

  <!-- legend -->
  <line x1="220" y1="862" x2="260" y2="862" class="wire"/>
  <text x="268" y="867" class="small">資料路徑</text>
  <line x1="350" y1="862" x2="390" y2="862" class="psum"/>
  <text x="398" y="867" class="small">部分和 (psum) 路徑</text>
  <line x1="540" y1="862" x2="580" y2="862" class="ctrl"/>
  <text x="588" y="867" class="small">控制 / 定址</text>
</svg>
